<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buscador de Descontos e Benefícios</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #fff0f5;
      color: #333333;
      padding: 16px;
      max-width: 800px;
      margin: 0 auto;
    }
    header { text-align: center; padding: 12px 0 20px 0; }
    h1 { color: #d81b60; font-size: 24px; margin-bottom: 6px; }
    .subtitle { color: #888888; font-size: 14px; }
    .controls {
      background-color: #ffffff;
      padding: 16px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(216, 27, 96, 0.08);
      border: 1px solid #fce4ec;
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .search-input {
      width: 100%;
      padding: 12px;
      border: 1px solid #f48fb1;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
    }
    .filter-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    @media (max-width: 500px) { .filter-group { grid-template-columns: 1fr; } }
    select {
      width: 100%;
      padding: 10px;
      border: 1px solid #f48fb1;
      border-radius: 8px;
      font-size: 14px;
      background-color: #ffffff;
    }
    .counter { font-size: 13px; color: #888888; text-align: right; }
    .cards-grid { display: flex; flex-direction: column; gap: 12px; }
    .card {
      background-color: #ffffff;
      border-radius: 12px;
      padding: 16px;
      border: 1px solid #f8bbd0;
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }
    .card-title { font-size: 18px; font-weight: 700; color: #d81b60; }
    .tags { display: flex; gap: 6px; flex-wrap: wrap; }
    .tag {
      font-size: 11px;
      font-weight: 600;
      padding: 4px 8px;
      border-radius: 12px;
      text-transform: uppercase;
    }
    .tag-cat { background-color: #fce4ec; color: #c2185b; }
    .tag-subcat { background-color: #f3e5f5; color: #7b1fa2; }
    .benefit-item {
      display: flex;
      justify-content: space-between;
      background-color: #fff8fa;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 13px;
      margin-bottom: 6px;
      border-left: 3px solid #f48fb1;
    }
    .benefit-program { font-weight: 600; color: #444444; }
    .benefit-value { color: #d81b60; font-weight: 700; }
  </style>
</head>
<body>

  <header>
    <h1>Buscador de Descontos</h1>
    <p class="subtitle">Encontre recompensas, cashback e benefícios por loja</p>
  </header>

  <div class="controls">
    <input type="text" id="searchInput" class="search-input" placeholder="Pesquisar loja ou benefício...">
    
    <div class="filter-group">
      <select id="catSelect">
        <option value="">Todas as Categorias</option>
      </select>

      <select id="subcatSelect">
        <option value="">Todas as Subcategorias</option>
      </select>
    </div>

    <div class="filter-group">
      <select id="sortSelect">
        <option value="az">Ordem A-Z</option>
        <option value="za">Ordem Z-A</option>
      </select>
      <div class="counter" id="storeCounter">Carregando...</div>
    </div>
  </div>

  <div id="cardsContainer" class="cards-grid"></div>

  <script>
    // Substitua este array pelo JSON gerado a partir da sua planilha
    const storesData = [/* DADOS_JSON_DA_PLANILHA */];

    const searchInput = document.getElementById('searchInput');
    const catSelect = document.getElementById('catSelect');
    const subcatSelect = document.getElementById('subcatSelect');
    const sortSelect = document.getElementById('sortSelect');
    const cardsContainer = document.getElementById('cardsContainer');
    const storeCounter = document.getElementById('storeCounter');

    function initCategories() {
      const categories = [...new Set(storesData.map(item => item.cat).filter(Boolean))].sort();
      categories.forEach(cat => {
        const opt = document.createElement('option');
        opt.value = cat;
        opt.textContent = cat;
        catSelect.appendChild(opt);
      });
      updateSubcategoryOptions();
    }

    function updateSubcategoryOptions() {
      const selectedCat = catSelect.value;
      const currentSubcat = subcatSelect.value;

      let relevantStores = storesData;
      if (selectedCat) {
        relevantStores = storesData.filter(s => s.cat === selectedCat);
      }

      const subcategories = [...new Set(relevantStores.map(item => item.subcat).filter(Boolean))].sort();

      subcatSelect.innerHTML = '<option value="">Todas as Subcategorias</option>';

      if (subcategories.length > 0) {
        subcatSelect.disabled = false;
        subcategories.forEach(subcat => {
          const opt = document.createElement('option');
          opt.value = subcat;
          opt.textContent = subcat;
          subcatSelect.appendChild(opt);
        });

        const hasEmptySubcat = relevantStores.some(s => !s.subcat);
        if (hasEmptySubcat && selectedCat) {
          const optNone = document.createElement('option');
          optNone.value = "__NONE__";
          optNone.textContent = "(Sem Subcategoria)";
          subcatSelect.appendChild(optNone);
        }

        if (subcategories.includes(currentSubcat) || currentSubcat === "__NONE__") {
          subcatSelect.value = currentSubcat;
        } else {
          subcatSelect.value = "";
        }
      } else {
        subcatSelect.disabled = true;
        subcatSelect.value = "";
      }
    }

    function renderCards() {
      const search = searchInput.value.toLowerCase().trim();
      const selectedCat = catSelect.value;
      const selectedSubcat = subcatSelect.value;
      const sortOrder = sortSelect.value;

      let filtered = storesData.filter(item => {
        if (selectedCat && item.cat !== selectedCat) return false;

        if (selectedSubcat === "__NONE__") {
          if (item.subcat !== "") return false;
        } else if (selectedSubcat && item.subcat !== selectedSubcat) {
          return false;
        }

        if (search) {
          const inName = item.nome.toLowerCase().includes(search);
          const inCat = item.cat.toLowerCase().includes(search);
          const inSubcat = item.subcat.toLowerCase().includes(search);
          const inBenefits = Object.entries(item.beneficios).some(
            ([prog, val]) => prog.toLowerCase().includes(search) || val.toLowerCase().includes(search)
          );
          return inName || inCat || inSubcat || inBenefits;
        }

        return true;
      });

      filtered.sort((a, b) => {
        if (sortOrder === 'az') return a.nome.localeCompare(b.nome, 'pt-BR');
        if (sortOrder === 'za') return b.nome.localeCompare(a.nome, 'pt-BR');
        return 0;
      });

      storeCounter.textContent = `Exibindo ${filtered.length} de ${storesData.length} lojas`;

      if (filtered.length === 0) {
        cardsContainer.innerHTML = `<div class="card" style="text-align:center; padding: 24px; color: #888;">Nenhuma loja encontrada.</div>`;
        return;
      }

      cardsContainer.innerHTML = filtered.map(item => {
        const benefitsEntries = Object.entries(item.beneficios);
        const benefitsHtml = benefitsEntries.length > 0 
          ? benefitsEntries.map(([prog, val]) => `
              <div class="benefit-item">
                <span class="benefit-program">${prog}</span>
                <span class="benefit-value">${val}</span>
              </div>
            `).join('')
          : `<div style="font-size: 13px; color: #999; font-style: italic;">Nenhum benefício cadastrado</div>`;

        return `
          <div class="card">
            <div class="card-header">
              <div class="card-title">${item.nome}</div>
              <div class="tags">
                <span class="tag tag-cat">${item.cat}</span>
                ${item.subcat ? `<span class="tag tag-subcat">${item.subcat}</span>` : ''}
              </div>
            </div>
            <div>${benefitsHtml}</div>
          </div>
        `;
      }).join('');
    }

    searchInput.addEventListener('input', renderCards);
    catSelect.addEventListener('change', () => {
      updateSubcategoryOptions();
      renderCards();
    });
    subcatSelect.addEventListener('change', renderCards);
    sortSelect.addEventListener('change', renderCards);

    initCategories();
    renderCards();
  </script>
</body>
</html>
