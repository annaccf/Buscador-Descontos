<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador de Benefícios</title>
    <style>
        :root {
            --bg-color: #fdeef3;
            --card-bg: #ffffff;
            --primary: #9b1b52;
            --primary-soft: #fbe4ed;
            --text-dark: #4a0e2e;
            --text-muted: #8c5b75;
            --border: #f3c2d4;
            --shadow: rgba(155, 27, 82, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-dark);
            padding: 20px 12px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        h1 {
            text-align: center;
            color: var(--primary);
            font-size: 1.6rem;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .filter-box {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        input, select {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background-color: #ffffff;
            color: var(--text-dark);
            font-size: 0.95rem;
            outline: none;
            box-shadow: 0 2px 6px var(--shadow);
            appearance: none;
        }

        select {
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%239b1b52'%3e%3cpath d='M7 10l5 5 5-5z'/%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 12px center;
            background-size: 20px;
        }

        input::placeholder {
            color: #d19bb6;
        }

        .counter {
            text-align: center;
            font-weight: 700;
            color: var(--primary);
            font-size: 0.9rem;
            margin: 6px 0;
        }

        hr {
            border: none;
            border-top: 1px solid var(--border);
            margin-bottom: 4px;
        }

        .cards-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 4px 12px var(--shadow);
            border: 1px solid #f9e2ec;
        }

        .card-header {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 6px;
            margin-bottom: 12px;
        }

        .store-name {
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--text-dark);
        }

        .badge-group {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .badge {
            background-color: #f38ba8;
            color: #ffffff;
            font-size: 0.7rem;
            font-weight: 800;
            padding: 3px 8px;
            border-radius: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .badge.sub {
            background-color: #eba0b5;
        }

        .benefits-list {
            border-top: 1px dashed var(--border);
            padding-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .benefit-item {
            background-color: var(--primary-soft);
            padding: 10px 12px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.88rem;
        }

        .program-name {
            font-weight: 700;
            color: var(--primary);
        }

        .benefit-value {
            font-weight: 600;
            color: var(--primary);
            text-align: right;
        }

        .empty-message {
            text-align: center;
            color: var(--text-muted);
            padding: 20px;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Buscador de Benefícios</h1>

    <div class="filter-box">
        <input type="text" id="searchInput" placeholder="Qual loja você está procurando?" oninput="filterStores()">
        
        <select id="categorySelect" onchange="filterStores()">
            <option value="">Todas as Categorias</option>
        </select>

        <select id="subcategorySelect" onchange="filterStores()">
            <option value="">Todas as Subcategorias</option>
        </select>

        <select id="programSelect" onchange="filterStores()">
            <option value="">Todos os Programas</option>
        </select>

        <select id="orderSelect" onchange="filterStores()">
            <option value="AZ">Ordem: A - Z</option>
            <option value="ZA">Ordem: Z - A</option>
        </select>
    </div>

    <div class="counter" id="counter">Mostrando 0 de 0 lojas</div>
    <hr>

    <div class="cards-list" id="cardsContainer"></div>
</div>

<script>
    // Cole ou atualize a lista completa de lojas do seu Excel nesta estrutura JSON:
    const storesData = [
        {
            loja: "3 Corações",
            categoria: "ALIMENTAÇÃO",
            subcategoria: "",
            beneficios: [
                { programa: "Mastercard", valor: "Pague 1 Leve 2" }
            ]
        },
        {
            loja: "3qa",
            categoria: "TECNOLOGIA",
            subcategoria: "",
            beneficios: [
                { programa: "Livelo", valor: "2 pts por R$1" },
                { programa: "Inter Site", valor: "6% de cashback" }
            ]
        }
    ];

    function initFilters() {
        const categories = new Set();
        const subcategories = new Set();
        const programs = new Set();

        storesData.forEach(item => {
            if (item.categoria) categories.add(item.categoria);
            if (item.subcategoria) subcategories.add(item.subcategoria);
            if (item.beneficios) {
                item.beneficios.forEach(b => {
                    if (b.programa) programs.add(b.programa);
                });
            }
        });

        populateSelect('categorySelect', Array.from(categories).sort(), 'Todas as Categorias');
        populateSelect('subcategorySelect', Array.from(subcategories).sort(), 'Todas as Subcategorias');
        populateSelect('programSelect', Array.from(programs).sort(), 'Todos os Programas');

        filterStores();
    }

    function populateSelect(id, items, defaultText) {
        const select = document.getElementById(id);
        select.innerHTML = `<option value="">${defaultText}</option>`;
        items.forEach(item => {
            const opt = document.createElement('option');
            opt.value = item;
            opt.textContent = item;
            select.appendChild(opt);
        });
    }

    function filterStores() {
        const search = document.getElementById('searchInput').value.toLowerCase().trim();
        const cat = document.getElementById('categorySelect').value;
        const sub = document.getElementById('subcategorySelect').value;
        const prog = document.getElementById('programSelect').value;
        const order = document.getElementById('orderSelect').value;

        let filtered = storesData.filter(item => {
            const matchesSearch = item.loja.toLowerCase().includes(search);
            const matchesCat = !cat || item.categoria === cat;
            const matchesSub = !sub || item.subcategoria === sub;
            const matchesProg = !prog || item.beneficios.some(b => b.programa === prog);

            return matchesSearch && matchesCat && matchesSub && matchesProg;
        });

        filtered.sort((a, b) => {
            return order === 'AZ' 
                ? a.loja.localeCompare(b.loja, 'pt-BR', { sensitivity: 'base' })
                : b.loja.localeCompare(a.loja, 'pt-BR', { sensitivity: 'base' });
        });

        renderCards(filtered);
    }

    function renderCards(list) {
        const container = document.getElementById('cardsContainer');
        const counter = document.getElementById('counter');

        counter.textContent = `Mostrando ${list.length} de ${storesData.length} lojas`;
        container.innerHTML = '';

        if (list.length === 0) {
            container.innerHTML = '<div class="empty-message">Nenhuma loja encontrada com esses filtros.</div>';
            return;
        }

        list.forEach(item => {
            const card = document.createElement('div');
            card.className = 'card';

            let badgesHtml = '';
            if (item.categoria) badgesHtml += `<span class="badge">${item.categoria}</span>`;
            if (item.subcategoria) badgesHtml += `<span class="badge sub">${item.subcategoria}</span>`;

            let benefitsHtml = '';
            if (item.beneficios && item.beneficios.length > 0) {
                benefitsHtml = item.beneficios.map(b => `
                    <div class="benefit-item">
                        <span class="program-name">${b.programa}</span>
                        <span class="benefit-value">${b.valor}</span>
                    </div>
                `).join('');
            }

            card.innerHTML = `
                <div class="card-header">
                    <div class="store-name">${item.loja}</div>
                    ${badgesHtml ? `<div class="badge-group">${badgesHtml}</div>` : ''}
                </div>
                <div class="benefits-list">
                    ${benefitsHtml}
                </div>
            `;

            container.appendChild(card);
        });
    }

    document.addEventListener('DOMContentLoaded', initFilters);
</script>
</body>
</html>
