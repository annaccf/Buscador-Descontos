<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buscador de Benefícios</title>
  <style>
    :root {
      --bg-color: #fce7f3;
      --card-bg: #ffffff;
      --primary: #9d174d;
      --primary-light: #fbcfe8;
      --accent: #be185d;
      --text-main: #831843;
      --text-muted: #9f1239;
      --border: #f472b6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 20px 15px;
      max-width: 600px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      color: var(--primary);
      margin-bottom: 20px;
      font-size: 1.8rem;
    }

    .filters-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
    }

    input, select {
      width: 100%;
      padding: 14px 16px;
      border: 1.5px solid var(--border);
      border-radius: 14px;
      background-color: #ffffff;
      color: var(--primary);
      font-size: 1rem;
      outline: none;
      box-shadow: 0 2px 5px rgba(0,0,0,0.03);
    }

    input::placeholder {
      color: #f472b6;
    }

    input:focus, select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(190, 24, 93, 0.2);
    }

    .counter {
      text-align: center;
      font-weight: bold;
      color: var(--primary);
      margin: 15px 0;
      font-size: 1rem;
    }

    .cards-list {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 4px 12px rgba(157, 23, 77, 0.08);
      border: 1px solid #fbcfe8;
    }

    .card-title {
      font-size: 1.3rem;
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 6px;
    }

    .badges {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 15px;
    }

    .badge {
      background-color: #fce7f3;
      color: var(--accent);
      font-size: 0.75rem;
      font-weight: bold;
      padding: 4px 10px;
      border-radius: 8px;
      text-transform: uppercase;
    }

    .benefits-list {
      border-top: 1px dashed var(--primary-light);
      padding-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .benefit-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #fff5f8;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 0.95rem;
    }

    .program-name {
      font-weight: 700;
      color: var(--primary);
    }

    .benefit-value {
      color: var(--accent);
      font-weight: 600;
    }
  </style>
</head>
<body>

  <h1>Buscador de Benefícios</h1>

  <div class="filters-container">
    <input type="text" id="search" placeholder="Qual loja você está procurando?" oninput="aplicarFiltros()">
    
    <select id="categoria" onchange="atualizarSubcategorias(); aplicarFiltros();">
      <option value="">Todas as Categorias</option>
    </select>

    <select id="subcategoria" onchange="aplicarFiltros()">
      <option value="">Todas as Subcategorias</option>
    </select>

    <select id="programa" onchange="aplicarFiltros()">
      <option value="">Todos os Programas</option>
    </select>

    <select id="ordem" onchange="aplicarFiltros()">
      <option value="az">Ordem: A - Z</option>
      <option value="za">Ordem: Z - A</option>
    </select>
  </div>

  <div class="counter" id="contador">Mostrando 0 de 0 lojas</div>

  <div class="cards-list" id="listaLojas"></div>

  <script>
    // Cole seus dados estruturados aqui
    const dadosLojas = [
      {
        nome: "3 Corações",
        categoria: "ALIMENTAÇÃO",
        subcategoria: "",
        beneficios: [
          { programa: "Mastercard", valor: "Pague 1 Leve 2" }
        ]
      },
      {
        nome: "3qa",
        categoria: "TECNOLOGIA",
        subcategoria: "",
        beneficios: [
          { programa: "Livelo", valor: "2 pts por R$1" },
          { programa: "Inter Site", valor: "6% de cashback" }
        ]
      }
    ];

    function carregarOpcoesFiltros() {
      const categorias = new Set();
      const programas = new Set();

      dadosLojas.forEach(loja => {
        if (loja.categoria) categorias.add(loja.categoria);
        loja.beneficios.forEach(b => programas.add(b.programa));
      });

      const selectCat = document.getElementById("categoria");
      Array.from(categorias).sort().forEach(cat => {
        selectCat.innerHTML += `<option value="${cat}">${cat}</option>`;
      });

      const selectProg = document.getElementById("programa");
      Array.from(programas).sort().forEach(prog => {
        selectProg.innerHTML += `<option value="${prog}">${prog}</option>`;
      });

      atualizarSubcategorias();
    }

    function atualizarSubcategorias() {
      const catSelecionada = document.getElementById("categoria").value;
      const selectSub = document.getElementById("subcategoria");
      selectSub.innerHTML = '<option value="">Todas as Subcategorias</option>';

      const subcategorias = new Set();
      dadosLojas.forEach(loja => {
        if (!catSelecionada || loja.categoria === catSelecionada) {
          if (loja.subcategoria) subcategorias.add(loja.subcategoria);
        }
      });

      Array.from(subcategorias).sort().forEach(sub => {
        selectSub.innerHTML += `<option value="${sub}">${sub}</option>`;
      });
    }

    function aplicarFiltros() {
      const busca = document.getElementById("search").value.toLowerCase();
      const categoria = document.getElementById("categoria").value;
      const subcategoria = document.getElementById("subcategoria").value;
      const programa = document.getElementById("programa").value;
      const ordem = document.getElementById("ordem").value;

      let filtrados = dadosLojas.filter(loja => {
        const bateNome = loja.nome.toLowerCase().includes(busca);
        const bateCat = !categoria || loja.categoria === categoria;
        const bateSub = !subcategoria || loja.subcategoria === subcategoria;
        const bateProg = !programa || loja.beneficios.some(b => b.programa === programa);

        return bateNome && bateCat && bateSub && bateProg;
      });

      filtrados.sort((a, b) => {
        return ordem === "az" 
          ? a.nome.localeCompare(b.nome, 'pt-BR') 
          : b.nome.localeCompare(a.nome, 'pt-BR');
      });

      renderizar(filtrados);
    }

    function renderizar(lojas) {
      const container = document.getElementById("listaLojas");
      const contador = document.getElementById("contador");
      container.innerHTML = "";

      contador.innerText = `Mostrando ${lojas.length} de ${dadosLojas.length} lojas`;

      lojas.forEach(loja => {
        const card = document.createElement("div");
        card.className = "card";

        let badgesHTML = `<span class="badge">${loja.categoria}</span>`;
        if (loja.subcategoria) {
          badgesHTML += `<span class="badge">${loja.subcategoria}</span>`;
        }

        let beneficiosHTML = loja.beneficios.map(b => `
          <div class="benefit-item">
            <span class="program-name">${b.programa}</span>
            <span class="benefit-value">${b.valor}</span>
          </div>
        `).join("");

        card.innerHTML = `
          <div class="card-title">${loja.nome}</div>
          <div class="badges">${badgesHTML}</div>
          <div class="benefits-list">${beneficiosHTML}</div>
        `;

        container.appendChild(card);
      });
    }

    carregarOpcoesFiltros();
    aplicarFiltros();
  </script>
</body>
</html>
