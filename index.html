<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador de Benefícios</title>
    <!-- Leitor do arquivo Excel em tempo real -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #fdebee;
            color: #800b38;
            padding: 16px;
            max-width: 500px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            font-size: 24px;
            font-weight: 800;
            margin: 16px 0 20px 0;
            color: #800b38;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        input, select {
            width: 100%;
            padding: 14px 16px;
            border-radius: 12px;
            border: 1px solid #f2bdcd;
            background-color: #ffffff;
            color: #800b38;
            font-size: 15px;
            outline: none;
            box-shadow: 0 2px 6px rgba(128, 11, 56, 0.04);
            appearance: none;
            -webkit-appearance: none;
        }

        input::placeholder {
            color: #d1829b;
        }

        .select-wrapper {
            position: relative;
        }

        .select-wrapper::after {
            content: '∨';
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #800b38;
            pointer-events: none;
            font-size: 12px;
            font-weight: bold;
        }

        .counter {
            text-align: center;
            font-weight: 700;
            font-size: 16px;
            color: #800b38;
            margin: 8px 0 20px 0;
        }

        .divider {
            height: 1px;
            background-color: #f2bdcd;
            margin-bottom: 20px;
        }

        .card {
            background-color: #ffffff;
            border-radius: 16px;
            padding: 18px;
            margin-bottom: 16px;
            box-shadow: 0 4px 12px rgba(128, 11, 56, 0.05);
            border: 1px solid #fae1e8;
        }

        .store-name {
            font-size: 20px;
            font-weight: 800;
            color: #800b38;
            margin-bottom: 8px;
        }

        .badge-container {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .badge {
            background-color: #f7a8c4;
            color: #ffffff;
            font-size: 11px;
            font-weight: 800;
            padding: 4px 10px;
            border-radius: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .badge-sub {
            background-color: #e282a5;
        }

        .card-divider {
            border: none;
            border-top: 1px dashed #f2bdcd;
            margin: 12px 0;
        }

        .benefit-item {
            background-color: #fdf2f5;
            border-radius: 10px;
            padding: 12px 14px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .benefit-item:last-child {
            margin-bottom: 0;
        }

        .program-name {
            font-weight: 700;
            font-size: 14px;
            color: #800b38;
        }

        .benefit-detail {
            font-weight: 700;
            font-size: 14px;
            color: #d12e66;
            text-align: right;
        }

        .file-upload-box {
            background: #fff;
            border: 2px dashed #f2bdcd;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            margin-bottom: 15px;
            font-size: 14px;
        }

        .file-upload-box input {
            border: none;
            padding: 5px;
            box-shadow: none;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <h1>Buscador de Benefícios</h1>

    <!-- Seleção manual de arquivo (escondida se carregar automaticamente no GitHub) -->
    <div id="uploadBox" class="file-upload-box">
        <p style="margin-bottom: 8px; font-weight: bold; color: #800b38;">Selecione o arquivo DESCONTOS_2.xlsx</p>
        <input type="file" id="excelFile" accept=".xlsx, .xls">
    </div>

    <div class="controls">
        <input type="text" id="searchInput" placeholder="Qual loja você está procurando?">
        
        <div class="select-wrapper">
            <select id="filterCat">
                <option value="">Todas as Categorias</option>
            </select>
        </div>

        <div class="select-wrapper">
            <select id="filterSubCat">
                <option value="">Todas as Subcategorias</option>
            </select>
        </div>

        <div class="select-wrapper">
            <select id="filterProg">
                <option value="">Todos os Programas</option>
            </select>
        </div>

        <div class="select-wrapper">
            <select id="sortOrder">
                <option value="az">Ordem: A - Z</option>
                <option value="za">Ordem: Z - A</option>
            </select>
        </div>
    </div>

    <div class="counter" id="counterText">Carregando dados...</div>
    <div class="divider"></div>

    <div id="storeList"></div>

    <script>
        let storesData = [];
        let allCategories = new Set();
        let allSubCategories = new Set();
        let allPrograms = new Set();

        // Normalização de texto para busca sem acentos
        function norm(str) {
            if (!str) return '';
            return str.toString().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim();
        }

        // Tenta carregar DESCONTOS_2.xlsx diretamente do GitHub Pages
        window.addEventListener('DOMContentLoaded', () => {
            fetch('DESCONTOS_2.xlsx')
                .then(res => {
                    if (!res.ok) throw new Error('Arquivo não localizado no servidor');
                    return res.arrayBuffer();
                })
                .then(buffer => processExcelBuffer(buffer))
                .catch(() => {
                    document.getElementById('uploadBox').classList.remove('hidden');
                    document.getElementById('counterText').innerText = 'Por favor, selecione a planilha acima.';
                });
        });

        document.getElementById('excelFile').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (evt) => processExcelBuffer(evt.target.result);
            reader.readAsArrayBuffer(file);
        });

        function processExcelBuffer(buffer) {
            const workbook = XLSX.read(buffer, { type: 'array' });
            const firstSheetName = workbook.SheetNames[0];
            const worksheet = workbook.Sheets[firstSheetName];
            const rawData = XLSX.utils.sheet_to_json(worksheet, { defval: '' });

            parseStores(rawData);
            document.getElementById('uploadBox').classList.add('hidden');
        }

        function parseStores(rawData) {
            if (!rawData || rawData.length === 0) return;

            const keys = Object.keys(rawData[0]);
            let keyLoja = keys.find(k => /loja|nome/i.test(k)) || keys[0];
            let keyCat = keys.find(k => /^categoria$/i.test(k) \vert{}\vert{} /^cat$/i.test(k)) || keys.find(k => /categoria/i.test(k));
            let keySubCat = keys.find(k => /sub/i.test(k));
            let keyProg = keys.find(k => /programa|cartao|banco/i.test(k));
            let keyBen = keys.find(k => /beneficio|desconto|cashback/i.test(k));

            const storeMap = new Map();
            allCategories.clear();
            allSubCategories.clear();
            allPrograms.clear();

            rawData.forEach(row => {
                const lojaName = String(row[keyLoja] || '').trim();
                if (!lojaName) return;

                const cat = keyCat ? String(row[keyCat] || '').trim() : '';
                const subCat = keySubCat ? String(row[keySubCat] || '').trim() : '';

                if (cat) allCategories.add(cat);
                if (subCat) allSubCategories.add(subCat);

                if (!storeMap.has(lojaName)) {
                    storeMap.set(lojaName, {
                        nome: lojaName,
                        categoria: cat,
                        subcategoria: subCat,
                        beneficios: []
                    });
                }

                const storeObj = storeMap.get(lojaName);

                if (keyProg && keyBen) {
                    const prog = String(row[keyProg] || '').trim();
                    const ben = String(row[keyBen] || '').trim();
                    if (prog && ben) {
                        allPrograms.add(prog);
                        storeObj.beneficios.push({ programa: prog, detalhe: ben });
                    }
                } else {
                    keys.forEach(k => {
                        if (k !== keyLoja && k !== keyCat && k !== keySubCat) {
                            const val = String(row[k] || '').trim();
                            if (val && val !== '-' && val !== 'N/A') {
                                allPrograms.add(k.trim());
                                storeObj.beneficios.push({ programa: k.trim(), detalhe: val });
                            }
                        }
                    });
                }
            });

            storesData = Array.from(storeMap.values());
            populateSelects();
            render();
        }

        function populateSelects() {
            const catSelect = document.getElementById('filterCat');
            const progSelect = document.getElementById('filterProg');

            catSelect.innerHTML = '<option value="">Todas as Categorias</option>';
            Array.from(allCategories).sort().forEach(c => {
                catSelect.innerHTML += `<option value="${c}">${c}</option>`;
            });

            populateSubCategories();

            progSelect.innerHTML = '<option value="">Todos os Programas</option>';
            Array.from(allPrograms).sort().forEach(p => {
                progSelect.innerHTML += `<option value="${p}">${p}</option>`;
            });
        }

        function populateSubCategories() {
            const selectedCat = document.getElementById('filterCat').value;
            const subCatSelect = document.getElementById('filterSubCat');
            subCatSelect.innerHTML = '<option value="">Todas as Subcategorias</option>';

            const subs = new Set();
            storesData.forEach(s => {
                if (!selectedCat || s.categoria === selectedCat) {
                    if (s.subcategoria) subs.add(s.subcategoria);
                }
            });

            Array.from(subs).sort().forEach(sc => {
                subCatSelect.innerHTML += `<option value="${sc}">${sc}</option>`;
            });
        }

        function render() {
            const searchVal = norm(document.getElementById('searchInput').value);
            const catVal = document.getElementById('filterCat').value;
            const subCatVal = document.getElementById('filterSubCat').value;
            const progVal = document.getElementById('filterProg').value;
            const sortVal = document.getElementById('sortOrder').value;

            let filtered = storesData.filter(store => {
                if (searchVal && !norm(store.nome).includes(searchVal)) return false;
                if (catVal && store.categoria !== catVal) return false;
                if (subCatVal && store.subcategoria !== subCatVal) return false;
                if (progVal) {
                    const hasProg = store.beneficios.some(b => b.programa === progVal);
                    if (!hasProg) return false;
                }
                return true;
            });

            filtered.sort((a, b) => {
                if (sortVal === 'az') return a.nome.localeCompare(b.nome, 'pt-BR');
                return b.nome.localeCompare(a.nome, 'pt-BR');
            });

            document.getElementById('counterText').innerText = `Mostrando ${filtered.length} de ${storesData.length} lojas`;

            const container = document.getElementById('storeList');
            if (filtered.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: #d1829b; padding: 20px;">Nenhuma loja encontrada.</p>';
                return;
            }

            container.innerHTML = filtered.map(store => {
                let showBen = store.beneficios;
                if (progVal) {
                    showBen = store.beneficios.filter(b => b.programa === progVal);
                }

                const catBadge = store.categoria ? `<span class="badge">${store.categoria}</span>` : '';
                const subCatBadge = store.subcategoria ? `<span class="badge badge-sub">${store.subcategoria}</span>` : '';

                const benefitsHtml = showBen.map(b => `
                    <div class="benefit-item">
                        <span class="program-name">${b.programa}</span>
                        <span class="benefit-detail">${b.detalhe}</span>
                    </div>
                `).join('');

                return `
                    <div class="card">
                        <div class="card-header">
                            <div class="store-name">${store.nome}</div>
                            <div class="badge-container">
                                ${catBadge}
                                ${subCatBadge}
                            </div>
                        </div>
                        <hr class="card-divider">
                        ${benefitsHtml}
                    </div>
                `;
            }).join('');
        }

        document.getElementById('searchInput').addEventListener('input', render);
        document.getElementById('filterCat').addEventListener('change', () => {
            populateSubCategories();
            render();
        });
        document.getElementById('filterSubCat').addEventListener('change', render);
        document.getElementById('filterProg').addEventListener('change', render);
        document.getElementById('sortOrder').addEventListener('change', render);
    </script>
</body>
</html>
