    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #fff0f5; /* Fundo rosa bem clarinho */
            color: #4a0e2a; /* Texto escuro */
            margin: 0;
            padding: 16px;
        }
        .header {
            position: sticky;
            top: 0;
            background-color: #fff0f5;
            padding-bottom: 12px;
            z-index: 10;
            border-bottom: 1px solid #fce4ec;
            margin-bottom: 16px;
        }
        .controls {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 16px;
        }
        .controls input, .controls select {
            padding: 12px;
            border: 1px solid #f48fb1;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            background-color: #ffffff;
            color: #d81b60;
            box-shadow: 0 2px 4px rgba(233, 30, 99, 0.05);
        }
        .controls input:focus, .controls select:focus {
            border-color: #d81b60;
            box-shadow: 0 2px 8px rgba(233, 30, 99, 0.2);
        }
        .controls input::placeholder {
            color: #f06292;
        }
        .controls .row {
            display: flex;
            gap: 12px;
        }
        .controls select {
            flex: 1;
        }
        .counter {
            text-align: center;
            font-size: 13px;
            color: #c2185b;
            font-weight: 500;
        }
        .card {
            background-color: #ffffff;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 4px 10px rgba(233, 30, 99, 0.08);
            border: 1px solid #fce4ec;
        }
        .card-title {
            font-weight: 700;
            font-size: 17px;
            margin-bottom: 14px;
            color: #880e4f;
        }
        .offer {
            background-color: #fdf5f7;
            border-radius: 8px;
            padding: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #fce4ec;
        }
        .offer-type {
            font-weight: 600;
            font-size: 14px;
            color: #880e4f;
        }
        .offer-reward {
            font-size: 13px;
            color: #d81b60;
            text-align: right;
            max-width: 65%;
            word-wrap: break-word;
        }
        .offer-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .empty-state {
            text-align: center;
            color: #d81b60;
            font-size: 15px;
            margin-top: 40px;
        }
    </style>
</head>

                </select>
                <select id="filterSelect">
                    <option value="all">Todos os Filtros</option>
                </select>
            </div>
        </div>
        <div class="counter" id="counter">Mostrando 0 de 0 lojas</div>
    </div>
