<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#e83e8c">
<title>Meus Benefícios — Lojas & Descontos</title>
<style>
:root{
  --pink:#e83e8c;
  --pink-dark:#c92f75;
  --pink-light:#fff0f7;
  --pink-soft:#ffe2ef;
  --text:#30242b;
  --muted:#786b73;
  --bg:#fff7fa;
  --card:#ffffff;
  --border:#f0d8e3;
  --shadow:0 8px 28px rgba(174,57,108,.10);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:var(--text);
  background:linear-gradient(180deg,#fff 0,#fff7fa 34%,#fff7fa 100%);
}
button,input,select{font:inherit}
button{cursor:pointer}
.header{
  background:linear-gradient(135deg,#e83e8c,#d72f78);
  color:#fff;
  padding:28px 18px 32px;
  box-shadow:0 4px 18px rgba(200,45,113,.22);
}
.header-inner{max-width:1180px;margin:auto}
.brand{display:flex;align-items:center;gap:12px}
.logo{
  width:44px;height:44px;border-radius:14px;background:#fff;color:var(--pink);
  display:grid;place-items:center;font-size:23px;font-weight:900;
  box-shadow:0 4px 14px rgba(0,0,0,.12)
}
h1{font-size:clamp(24px,4vw,34px);margin:0;font-weight:800;letter-spacing:-.5px}
.subtitle{margin:8px 0 0;opacity:.92;font-size:14px}
.container{max-width:1180px;margin:-14px auto 0;padding:0 14px 40px}
.panel{
  background:var(--card);border:1px solid var(--border);border-radius:18px;
  padding:16px;box-shadow:var(--shadow)
}
.search-wrap{position:relative;margin-bottom:14px}
.search-icon{
  position:absolute;left:14px;top:50%;transform:translateY(-50%);
  color:var(--pink);font-size:20px;pointer-events:none
}
#search{
  width:100%;border:2px solid var(--pink-soft);border-radius:14px;
  padding:13px 44px;font-size:16px;outline:none;background:#fff;color:var(--text)
}
#search:focus{border-color:var(--pink);box-shadow:0 0 0 4px rgba(232,62,140,.10)}
.clear-search{
  position:absolute;right:9px;top:50%;transform:translateY(-50%);
  width:32px;height:32px;border:0;background:transparent;color:#a38d97;
  border-radius:50%;display:none
}
.filters{display:grid;grid-template-columns:1.25fr 1fr 1fr 1fr auto;gap:10px}
.field label{display:block;font-size:11px;font-weight:800;color:var(--muted);margin:0 0 5px 3px;text-transform:uppercase;letter-spacing:.45px}
select{
  width:100%;min-width:0;border:1px solid var(--border);background:#fff;
  color:var(--text);border-radius:11px;padding:10px 11px;outline:none
}
select:focus{border-color:var(--pink)}
.reset{
  align-self:end;border:1px solid var(--pink);background:#fff;color:var(--pink);
  border-radius:11px;padding:10px 13px;font-weight:700;white-space:nowrap
}
.reset:hover{background:var(--pink-light)}
.summary{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  margin:16px 2px 12px;flex-wrap:wrap
}
.count{font-size:14px;color:var(--muted)}
.count strong{color:var(--pink-dark)}
.sort{
  display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)
}
.sort select{width:auto;min-width:150px;padding:8px 10px}
.grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:13px
}
.card{
  background:#fff;border:1px solid var(--border);border-radius:16px;
  padding:16px;box-shadow:0 4px 16px rgba(90,35,59,.055);
  transition:.18s ease;display:flex;flex-direction:column;min-height:180px
}
.card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(90,35,59,.10);border-color:#edb8ce}
.card-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.store{font-size:19px;font-weight:800;line-height:1.2;letter-spacing:-.2px}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}
.tag{
  display:inline-flex;align-items:center;border-radius:999px;padding:4px 8px;
  font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.35px
}
.tag.category{background:var(--pink-light);color:var(--pink-dark)}
.tag.sub{background:#f6f3f5;color:#66545d}
.benefits{margin-top:13px;display:flex;flex-direction:column;gap:8px}
.benefit{
  border-left:3px solid var(--pink);background:#fff8fb;border-radius:0 9px 9px 0;
  padding:8px 9px
}
.program{font-size:11px;font-weight:800;color:var(--pink-dark);margin-bottom:2px}
.desc{font-size:13px;line-height:1.35;color:#4f4249}
.no-benefit{color:#9a8991;font-size:13px;font-style:italic;margin-top:13px}
.empty{
  display:none;text-align:center;padding:46px 18px;color:var(--muted)
}
.empty .emoji{font-size:36px;margin-bottom:8px}
.footer{text-align:center;color:#a18d96;font-size:11px;margin-top:20px}
mark{background:#ffd0e2;color:inherit;border-radius:3px;padding:0 1px}
@media(max-width:900px){
  .filters{grid-template-columns:1fr 1fr}
  .reset{align-self:stretch}
}
@media(max-width:560px){
  .header{padding:22px 15px 27px}
  .container{padding:0 10px 30px}
  .panel{padding:12px;border-radius:15px}
  .filters{grid-template-columns:1fr}
  .grid{grid-template-columns:1fr}
  .card{min-height:0}
  .sort{width:100%}
  .sort select{flex:1}
}
</style>
</head>
<body>
<header class="header">
  <div class="header-inner">
    <div class="brand">
      <div class="logo">%</div>
      <div>
        <h1>Meus Benefícios</h1>
        <div class="subtitle">Encontre rapidamente os descontos e benefícios de cada loja.</div>
      </div>
    </div>
  </div>
</header>

<main class="container">
  <section class="panel">
    <div class="search-wrap">
      <span class="search-icon">⌕</span>
      <input id="search" type="search" autocomplete="off"
        placeholder="Buscar loja, categoria, programa ou benefício...">
      <button class="clear-search" id="clearSearch" aria-label="Limpar busca">×</button>
    </div>

    <div class="filters">
      <div class="field">
        <label for="storeFilter">Loja</label>
        <select id="storeFilter"><option value="">Todas as lojas</option></select>
      </div>
      <div class="field">
        <label for="categoryFilter">Categoria</label>
        <select id="categoryFilter"><option value="">Todas as categorias</option></select>
      </div>
      <div class="field">
        <label for="subcategoryFilter">Subcategoria</label>
        <select id="subcategoryFilter"><option value="">Todas as subcategorias</option></select>
      </div>
      <div class="field">
        <label for="programFilter">Programa</label>
        <select id="programFilter"><option value="">Todos os programas</option></select>
      </div>
      <button class="reset" id="resetBtn">Limpar filtros</button>
    </div>
  </section>

  <div class="summary">
    <div class="count" id="count"></div>
    <div class="sort">
      <span>Ordenar:</span>
      <select id="sortFilter">
        <option value="az">A–Z</option>
        <option value="za">Z–A</option>
        <option value="category">Categoria</option>
      </select>
    </div>
  </div>

  <section id="grid" class="grid"></section>
  <section id="empty" class="empty">
    <div class="emoji">🔎</div>
    <strong>Nenhuma loja encontrada</strong>
    <div>Tente mudar a busca ou limpar algum filtro.</div>
  </section>

  <div class="footer">Dados carregados diretamente deste HTML — nenhum arquivo externo é necessário.</div>
</main>

Zé Delivery","benefits":[{"program":"Inter Giftcard","benefit":"3% de cashback no giftcard"}]},{"category":"PET","subcategory":"","store":"Zee Dog","benefits":[{"program":"BB","benefit":"Desconto de 2%"}]},{"category":"PET","subcategory":"","store":"Zee Now","benefits":[{"program":"BB","benefit":"Desconto de 2%"}]},{"category":"MARKETPLACE","subcategory":"","store":"Zift - Cartão Multimarcas","benefits":[{"program":"Inter Giftcard","benefit":"8% de cashback no giftcard"}]},{"category":"VIAGEM","subcategory":"","store":"Zupper","benefits":[{"program":"BB","benefit":"Desconto de 1.2%"}]},{"category":"MODA","subcategory":"","store":"ZZ Mall","benefits":[{"program":"Inter Giftcard","benefit":"3% de cashback no giftcard"},{"program":"Mastercard","benefit":"R$ 300 OFF"}]}];
const PROGRAMS = ["Livelo", "Inter Cashback", "Inter Site", "Inter Giftcard", "Vale", "Alelo", "Mastercard", "Itaú", "Recarga Pay", "BB", "VISA", "Bradesco"];
const CATEGORIES = ["ALIMENTAÇÃO", "AUTOMOTIVO", "BANCO", "BEBIDAS", "BELEZA", "BEM ESTAR", "BRINQUEDOS", "CASA", "CINEMA", "EDUCAÇÃO", "ENTRETENIMENTO", "ESPORTE", "FARMÁCIA", "FERRAMENTAS", "FLORES", "FOTOGRAFIA", "GEEK", "INFANTIL", "JOGOS", "JÓIAS", "LIVRO", "LIVROS", "LOTERIAS", "MARKETPLACE", "MODA", "PET", "RELÓGIOS", "SAÚDE", "SEGUROS", "SERVIÇO AMBIENTAL", "STREAM", "SUPERMERCADO", "TECNOLOGIA", "VIAGEM", "ÓTICA"];
const SUBCATEGORIES = ["BEBIDA", "BEM ESTAR", "CALÇADOS", "ESPORTE", "INFANTIL", "JOGOS", "MARKETPLACE", "MODA", "SEGUROS", "SUPERMERCADO", "TECNOLOGIA"];

const search = document.getElementById('search');
const clearSearch = document.getElementById('clearSearch');
const storeFilter = document.getElementById('storeFilter');
const categoryFilter = document.getElementById('categoryFilter');
const subcategoryFilter = document.getElementById('subcategoryFilter');
const programFilter = document.getElementById('programFilter');
const sortFilter = document.getElementById('sortFilter');
const resetBtn = document.getElementById('resetBtn');
const grid = document.getElementById('grid');
const empty = document.getElementById('empty');
const count = document.getElementById('count');

const norm = s => String(s ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
const escapeHTML = s => String(s ?? '').replace(/[&<>"']/g, ch => ({
  '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'
}[ch]));

function fillSelect(select, values, firstLabel){
  const current = select.value;
  select.innerHTML = `<option value="">${firstLabel}</option>` +
    values.map(v => `<option value="${escapeHTML(v)}">${escapeHTML(v)}</option>`).join('');
  if(values.includes(current)) select.value = current;
}

function populateStaticFilters(){
  fillSelect(storeFilter, [...new Set(DATA.map(x=>x.store))].sort((a,b)=>a.localeCompare(b,'pt-BR')), 'Todas as lojas');
  fillSelect(categoryFilter, CATEGORIES, 'Todas as categorias');
  fillSelect(programFilter, PROGRAMS, 'Todos os programas');
  updateSubcategories();
}

function updateSubcategories(){
  const cat = categoryFilter.value;
  const values = cat
    ? [...new Set(DATA.filter(x=>x.category===cat && x.subcategory).map(x=>x.subcategory))]
    : SUBCATEGORIES;
  fillSelect(subcategoryFilter, values.sort((a,b)=>a.localeCompare(b,'pt-BR')), 'Todas as subcategorias');
}

function highlight(text, query){
  const safe = escapeHTML(text);
  if(!query) return safe;
  const q = norm(query).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  // Highlight is applied to the original text while matching accents-insensitively
  // by finding the visible substring with a normalized index.
  const n = norm(text);
  const nq = norm(query);
  const idx = n.indexOf(nq);
  if(idx < 0) return safe;
  // For accented strings, the normalized index is not always the same as the
  // original string index, so only use direct matching when lengths align.
  const direct = String(text).toLowerCase().indexOf(String(query).toLowerCase());
  if(direct >= 0){
    return escapeHTML(text.slice(0,direct)) + '<mark>' +
      escapeHTML(text.slice(direct,direct+String(query).length)) + '</mark>' +
      escapeHTML(text.slice(direct+String(query).length));
  }
  return safe;
}

function matches(item){
  const q = norm(search.value);
  const store = storeFilter.value;
  const cat = categoryFilter.value;
  const sub = subcategoryFilter.value;
  const prog = programFilter.value;

  if(store && item.store !== store) return false;
  if(cat && item.category !== cat) return false;
  if(sub && item.subcategory !== sub) return false;
  if(prog && !item.benefits.some(b=>b.program===prog)) return false;

  if(q){
    const hay = [
      item.store, item.category, item.subcategory,
      ...item.benefits.flatMap(b=>[b.program,b.benefit])
    ].map(norm).join(' ');
    if(!hay.includes(q)) return false;
  }
  return true;
}

function render(){
  const results = DATA.filter(matches);
  const sort = sortFilter.value;
  results.sort((a,b)=>{
    if(sort==='za') return b.store.localeCompare(a.store,'pt-BR');
    if(sort==='category') return a.category.localeCompare(b.category,'pt-BR') || a.store.localeCompare(b.store,'pt-BR');
    return a.store.localeCompare(b.store,'pt-BR');
  });

  count.innerHTML = `<strong>${results.length}</strong> de ${DATA.length} lojas`;
  grid.innerHTML = results.map(item=>{
    const q = search.value;
    const tags = `<div class="tags">
      <span class="tag category">${escapeHTML(item.category)}</span>
      ${item.subcategory ? `<span class="tag sub">${escapeHTML(item.subcategory)}</span>` : ''}
    </div>`;
    const benefits = item.benefits.length
      ? `<div class="benefits">${item.benefits.map(b=>`
          <div class="benefit">
            <div class="program">${escapeHTML(b.program)}</div>
            <div class="desc">${highlight(b.benefit,q)}</div>
          </div>`).join('')}</div>`
      : `<div class="no-benefit">Nenhum benefício informado na planilha.</div>`;
    return `<article class="card">
      <div class="card-top"><div class="store">${highlight(item.store,q)}</div></div>
      ${tags}
      ${benefits}
    </article>`;
  }).join('');

  empty.style.display = results.length ? 'none' : 'block';
}

search.addEventListener('input', ()=>{
  clearSearch.style.display = search.value ? 'block' : 'none';
  render();
});
clearSearch.addEventListener('click', ()=>{
  search.value=''; clearSearch.style.display='none'; render(); search.focus();
});
categoryFilter.addEventListener('change', ()=>{ updateSubcategories(); render(); });
[subcategoryFilter, storeFilter, programFilter, sortFilter].forEach(el=>el.addEventListener('change', render));
resetBtn.addEventListener('click', ()=>{
  search.value='';
  storeFilter.value='';
  categoryFilter.value='';
  updateSubcategories();
  subcategoryFilter.value='';
  programFilter.value='';
  sortFilter.value='az';
  clearSearch.style.display='none';
  render();
});

populateStaticFilters();
render();
</script>
