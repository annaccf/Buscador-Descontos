<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consultor de Benefícios e Descontos</title>
  <!-- Biblioteca para ler arquivos Excel (.xlsx) -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    :root {
      --bg-primary: #fff0f3;
      --bg-card: #ffffff;
      --pink-accent: #ffb3c6;
      --pink-dark: #c9184a;
      --pink-soft: #ffccd5;
      --text-color: #590d22;
      --border-radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-color);
      padding: 15px;
      max-width: 800px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
      padding: 10px 0;
    }

    h1 {
      font-size: 1.5rem;
      color: var(--pink-dark);
      margin-bottom: 5px;
    }

    .file-input-container {
      background-color: var(--bg-card);
      border: 2px dashed var(--pink-accent);
      padding: 15px;
      border-radius: var(--border-radius);
      text-align: center;
      margin-bottom: 20px;
    }

    .file-input-container input {
      display: none;
    }

    .btn-upload {
      background-color: var(--pink-dark);
      color: white;
      padding: 10px 20px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
      display: inline-block;
      transition: background 0.2s;
    }

    .controls-panel {
      background: var(--bg-card);
      padding: 15px;
      border-radius: var(--border-radius);
      box-shadow: 0 4px 12px rgba(201, 24, 74, 0.08);
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .search-box input {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--pink-accent);
      border-radius: 8px;
      outline: none;
      font-size: 1rem;
      background-color: #fffafb;
    }

    .search-box input:focus {
      border-color: var(--pink-dark);
    }

    .filters-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 10px;
    }

    select {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--pink-accent);
      border-radius: 8px;
      background-color: #fffafb;
      color: var(--text-color);
      outline: none;
      font-size: 0.9rem;
    }

    .cards-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card {
      background: var(--bg-card);
      border-left: 5px solid var(--pink-dark);
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .store-name {
      font-size: 1.1rem;
      font-weight: bold;
      color: var(--pink-dark);
    }

    .badges {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    .badge {
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 12px;
      font-weight: 600;
    }

    .badge-category {
      background-color: var(--pink-soft);
      color: var(--pink-dark);
    }

    .badge-program {
      background-color: #800020;
      color: white;
    }

    .card-body {
      font-size: 0.95rem;
      color: #333;
      line-height: 1.4;
    }

    .empty-state {
      text-align: center;
      padding: 30px;
      color: #a3485e;
    }
  </style>
</head>
<body>

  <header>
    <h1>Meus Descontos & Benefícios</h1>
    <p style="font-size: 0.85rem; color: #a3485e;">Consulte rapidamente onde comprar com vantagem</p>
  </header>

  <section class="file-input-container">
    <label for="excelFile" class="btn-upload">Carregar Planilha (.xlsx)</label>
    <input type="file" id="excelFile" accept=".xlsx, .xls, .csv">
    <p id="fileName" style="margin-top: 8px; font-size: 0.8rem; color: #666;">Nenhum arquivo carregado</p>
  </section>

  <section class="controls-panel">
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Buscar por loja, benefício ou palavra-chave...">
    </div>

    <div class="filters-grid">
      <select id="sortSelect">
        <option value="AZ">Ordem: A - Z</option>
        <option value="ZA">Ordem: Z - A</option>
      </select>

      <select id="storeFilter">
        <option value="">Todas as Lojas</option>
      </select>

      <select id="categoryFilter">
        <option value="">Todas as Categorias</option>
      </select>

      <select id="subcategoryFilter">
        <option value="">Todas as Subcategorias</option>
      </select>
    </div>
  </section>

  <main class="cards-container" id="cardsContainer">
    <div class="empty-state">Carregue sua planilha para visualizar os benefícios.</div>
  </main>

  <script>
    let rawData = [];

    document.getElementById('excelFile').addEventListener('change', handleFile);
    document.getElementById('searchInput').addEventListener('input', renderData);
    document.getElementById('sortSelect').addEventListener('change', renderData);
    document.getElementById('storeFilter').addEventListener('change', renderData);
    document.getElementById('categoryFilter').addEventListener('change', renderData);
    document.getElementById('subcategoryFilter').addEventListener('change', renderData);

    function handleFile(e) {
      const file = e.target.files[0];
      if (!file) return;

      document.getElementById('fileName').textContent = file.name;

      const reader = new FileReader();
      reader.onload = function(evt) {
        const data = new Uint8Array(evt.target.result);
        const workbook = XLSX.read(data, { type: 'array' });
        const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
        const jsonData = XLSX.utils.sheet_to_json(firstSheet, { defval: "" });

        rawData = normalizeKeys(jsonData);
        populateDropdowns();
        renderData();
      };
      reader.readAsArrayBuffer(file);
    }

    // Normaliza os nomes das colunas da planilha para busca universal
    function normalizeKeys(data) {
      return data.map(item => {
        const normalized = {};
        Object.keys(item).forEach(key => {
          const k = key.trim().toLowerCase();
          if (k.includes('loja')) normalized.loja = item[key];
          else if (k.includes('subcat') || k.includes('sub-cat')) normalized.subcategoria = item[key];
          else if (k.includes('cat')) normalized.categoria = item[key];
          else if (k.includes('prog') || k.includes('beneficio') || k.includes('cartao')) normalized.programa = item[key];
          else normalized[key] = item[key];
        });
        return normalized;
      });
    }

    function populateDropdowns() {
      const stores = [...new Set(rawData.map(d => d.loja).filter(Boolean))].sort();
      const categories = [...new Set(rawData.map(d => d.categoria).filter(Boolean))].sort();
      const subcategories = [...new Set(rawData.map(d => d.subcategoria).filter(Boolean))].sort();

      fillSelect('storeFilter', stores, 'Todas as Lojas');
      fillSelect('categoryFilter', categories, 'Todas as Categorias');
      fillSelect('subcategoryFilter', subcategories, 'Todas as Subcategorias');
    }

    function fillSelect(elementId, items, defaultText) {
      const select = document.getElementById(elementId);
      select.innerHTML = `<option value="">${defaultText}</option>`;
      items.forEach(item => {
        const opt = document.createElement('option');
        opt.value = item;
        opt.textContent = item;
        select.appendChild(opt);
      });
    }

    function renderData() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const sort = document.getElementById('sortSelect').value;
      const selectedStore = document.getElementById('storeFilter').value;
      const selectedCat = document.getElementById('categoryFilter').value;
      const selectedSubCat = document.getElementById('subcategoryFilter').value;

      let filtered = rawData.filter(item => {
        const matchesSearch = Object.values(item).some(val => 
          String(val).toLowerCase().includes(search)
        );
        const matchesStore = !selectedStore || item.loja === selectedStore;
        const matchesCat = !selectedCat || item.categoria === selectedCat;
        const matchesSubCat = !selectedSubCat || item.subcategoria === selectedSubCat;

        return matchesSearch && matchesStore && matchesCat && matchesSubCat;
      });

      filtered.sort((a, b) => {
        const nameA = String(a.loja || '').toLowerCase();
        const nameB = String(b.loja || '').toLowerCase();
        return sort === 'AZ' ? nameA.localeCompare(nameB) : nameB.localeCompare(nameA);
      });

      const container = document.getElementById('cardsContainer');
      container.innerHTML = '';

      if (filtered.length === 0) {
        container.innerHTML = `<div class="empty-state">Nenhum benefício encontrado com os filtros selecionados.</div>`;
        return;
      }

      filtered.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card';

        // Capturar propriedades restantes para o corpo do card
        const extraDetails = Object.keys(item)
          .filter(k => !['loja', 'categoria', 'subcategoria', 'programa'].includes(k))
          .map(k => `<strong>${k}:</strong> ${item[k]}`)
          .join('<br>');

        card.innerHTML = `
          <div class="card-header">
            <span class="store-name">${item.loja || 'Loja sem nome'}</span>
          </div>
          <div class="badges">
            ${item.programa ? `<span class="badge badge-program">${item.programa}</span>` : ''}
            ${item.categoria ? `<span class="badge badge-category">${item.categoria}</span>` : ''}
            ${item.subcategoria ? `<span class="badge badge-category" style="opacity:0.8">${item.subcategoria}</span>` : ''}
          </div>
          <div class="card-body">
            ${extraDetails}
          </div>
        `;
        container.appendChild(card);
      });
    }
  </script>
</body>
</html>
