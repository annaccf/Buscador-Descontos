        .controls input {

        }

            color: #f06292;

            text-align: center;
            font-size: 14px;
            color: #a01b4c;
            font-weight: 700;
            margin: 14px 0 10px 0;
        }
        .divider {
            border: 0;

            margin-bottom: 16px;
        }

            background-color: #ffffff;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 14px;

            font-weight: 800;
            font-size: 18px;
            color: #330015;
            margin-bottom: 6px;
        }

            display: inline-block;
            background-color: #f8bbd0;
            color: #880e4f;
            font-weight: 700;
            font-size: 11px;
            padding: 4px 10px;
            border-radius: 12px;

            letter-spacing: 0.5px;
        }

            border-top: 1px dashed #f8bbd0;
            margin: 10px 0 12px 0;
        }

            gap: 8px;

        const searchInput = document.getElementById('searchInput');

        const storeList = document.getElementById('storeList');
        const counter = document.getElementById('counter');

        programs.forEach(program => {
            const option = document.createElement('option');
            option.value = program;
            option.textContent = program;
            programSelect.appendChild(option);
        });

        function updateSubcategories() {
            const cat = categorySelect.value;
            subcategorySelect.innerHTML = '<option value="all">Todas as Subcategorias</option>';
            if (cat !== 'all' && subcategoryMap[cat]) {
                subcategoryMap[cat].forEach(sub => {
                    const opt = document.createElement('option');
                    opt.value = sub;
                    opt.textContent = sub;
                    subcategorySelect.appendChild(opt);
                });
            }
        }

        function render() {
            const searchVal = searchInput.value.toLowerCase().trim();
            const catVal = categorySelect.value;
            const subCatVal = subcategorySelect.value;
            const progVal = programSelect.value;
            const sortVal = sortSelect.value;

            let filtered = stores.filter(store => {
                const matchesSearch = store.name.toLowerCase().includes(searchVal);
                const matchesCat = catVal === 'all' || store.category === catVal;
                const matchesSubCat = subCatVal === 'all' || store.subcategory === subCatVal;
                const matchesProg = progVal === 'all' || store.offers.some(o => o.type === progVal);
                const hasOffers = store.offers.length > 0;

                return matchesSearch && matchesCat && matchesSubCat && matchesProg && hasOffers;
            });

            filtered.sort((a, b) => {
                if (sortVal === 'az') return a.name.localeCompare(b.name, 'pt-BR');
                if (sortVal === 'za') return b.name.localeCompare(a.name, 'pt-BR');
                return 0;
            });

            counter.innerText = `Mostrando ${filtered.length} de ${stores.filter(s => s.offers.length > 0).length} lojas`;

            if (filtered.length === 0) {
                storeList.innerHTML = `<div class="empty-state">Nenhuma loja encontrada com esses filtros.</div>`;

                            <span class="category-badge">${store.category}</span>
                        </div>

                                    </div>
                                `).join('')}
                        </div>
                    </div>
                `).join('');
            }
        }
