<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        :root {
            --primary: #d81b60;
            --primary-light: #f48fb1;
            --primary-dark: #880e4f;
            --bg-color: #fce4ec;
            --card-bg: #ffffff;
            --text-dark: #4a0e2a;
            --text-light: #880e4f;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-dark);
            padding: 16px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: var(--primary-dark);
            margin-bottom: 20px;
            font-size: 24px;
        }

        .header-controls {
            position: sticky;
            top: 0;
            background-color: var(--bg-color);
            padding: 10px 0 20px 0;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 12px;
            border-bottom: 2px solid var(--primary-light);
            margin-bottom: 20px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--primary-light);
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            background-color: var(--card-bg);
            color: var(--primary);
            box-shadow: 0 2px 4px rgba(216, 27, 96, 0.05);
            transition: all 0.3s ease;
        }

        input:focus, select:focus {
            border-color: var(--primary);
            box-shadow: 0 2px 8px rgba(216, 27, 96, 0.2);
        }

        input::placeholder {
            color: #f06292;
        }

        .filter-row {
            display: flex;
            gap: 10px;
        }
        
        @media (max-width: 600px) {
            .filter-row { flex-direction: column; }
        }

        .counter {
            text-align: center;
            font-size: 14px;
            color: var(--primary-dark);
            font-weight: 600;
            margin-top: 5px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 4px 10px rgba(216, 27, 96, 0.08);
            border: 1px solid var(--primary-light);
            transition: transform 0.2s;
        }
        
        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(216, 27, 96, 0.15);
        }

        .card-header {
            margin-bottom: 12px;
            border-bottom: 1px dashed var(--primary-light);
            padding-bottom: 8px;
        }

        .card-title {
            font-weight: 700;
            font-size: 18px;
            color: var(--primary-dark);
        }

        .card-category {
            font-size: 12px;
            color: var(--primary);
            text-transform: uppercase;
            font-weight: 600;
            margin-top: 4px;
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
        }
        
        .badge {
            background-color: var(--primary-light);
            color: white;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
        }

        .offer {
            background-color: #fdf5f7;
            border-radius: 8px;
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid var(--bg-color);
            margin-bottom: 8px;
            font-size: 13px;
        }
        
        .offer:last-child { margin-bottom: 0; }

        .offer-type {
            font-weight: 700;
            color: var(--primary-dark);
        }

        .offer-reward {
            color: var(--primary);
            text-align: right;
            max-width: 65%;
            word-wrap: break-word;
            font-weight: 500;
        }

        .empty-state {
            text-align: center;
            color: var(--primary);
            font-size: 16px;
            margin-top: 40px;
            grid-column: 1 / -1;
            font-weight: 500;
        }
    </style>
</head>

        const storeList = document.getElementById('storeList');
        const searchInput = document.getElementById('searchInput');
        const catSelect = document.getElementById('catSelect');
        const subcatSelect = document.getElementById('subcatSelect');
        const programSelect = document.getElementById('programSelect');
        const sortSelect = document.getElementById('sortSelect');
        const counter = document.getElementById('counter');

        // Extract Categories, Subcategories and Programs for Filters
        const categoriesMap = {}; // { "Category": Set("Sub1", "Sub2") }
        const programsSet = new Set();

        initialStores.forEach(store => {
            // Programs
            if(store.offers) {
                store.offers.forEach(offer => programsSet.add(offer.type));
            }
            // Categories and Subcategories
            if (store.category) {
                if (!categoriesMap[store.category]) {
                    categoriesMap[store.category] = new Set();
                }
                if (store.subcategory) {
                    categoriesMap[store.category].add(store.subcategory);
                }
            }
        });

        // Populate Category Filter
        Object.keys(categoriesMap).sort().forEach(cat => {
            if(!cat) return;
            const option = document.createElement('option');
            option.value = cat;
            option.textContent = cat;
            catSelect.appendChild(option);
        });

        // Populate Programs Filter
        Array.from(programsSet).sort().forEach(prog => {
            const option = document.createElement('option');
            option.value = prog;
            option.textContent = prog;
            programSelect.appendChild(option);
        });

        // Handle Category Change to populate Subcategories
        catSelect.addEventListener('change', (e) => {
            const selectedCat = e.target.value;
            subcatSelect.innerHTML = '<option value="all">Todas as Subcategorias</option>';
            
            if (selectedCat === 'all' || !categoriesMap[selectedCat] || categoriesMap[selectedCat].size === 0) {
                subcatSelect.disabled = true;
            } else {
                subcatSelect.disabled = false;
                Array.from(categoriesMap[selectedCat]).sort().forEach(sub => {
                    const option = document.createElement('option');
                    option.value = sub;
                    option.textContent = sub;
                    subcatSelect.appendChild(option);
                });
            }
            renderStores();
        });

        function renderStores() {
            const searchTerm = searchInput.value.toLowerCase();
            const sortOrder = sortSelect.value;
            const filterCat = catSelect.value;
            const filterSubcat = subcatSelect.value;
            const filterProgram = programSelect.value;
            
            let filtered = initialStores.filter(store => {
                // Search match (checks store name)
                const matchesSearch = store.name.toLowerCase().includes(searchTerm);
                
                // Category match
                const matchesCat = filterCat === 'all' || store.category === filterCat;
                
                // Subcategory match
                const matchesSubcat = filterSubcat === 'all' || store.subcategory === filterSubcat;
                
                // Program match
                const matchesProgram = filterProgram === 'all' || (store.offers && store.offers.some(o => o.type === filterProgram));
                
                return matchesSearch && matchesCat && matchesSubcat && matchesProgram;
            });
            
            if (sortOrder === 'az') {
                filtered.sort((a, b) => a.name.localeCompare(b.name));
            } else {
                filtered.sort((a, b) => b.name.localeCompare(a.name));
            }
            
            counter.textContent = `Mostrando ${filtered.length} de ${initialStores.length} lojas`;
            
            storeList.innerHTML = '';
            if (filtered.length === 0) {
                storeList.innerHTML = '<div class="empty-state">Nenhuma loja encontrada com esses filtros. �沽｢</div>';
                return;
            }
            
            filtered.forEach(store => {
                const card = document.createElement('div');
                card.className = 'card';
                
                let badgesHtml = '';
                if (store.category) badgesHtml += `<span class="badge">${store.category}</span>`;
                if (store.subcategory) badgesHtml += `<span class="badge" style="background-color: var(--primary)">${store.subcategory}</span>`;

                card.innerHTML = `
                    <div class="card-header">
                        <div class="card-title">${store.name}</div>
                        <div class="card-category">${badgesHtml}</div>
                    </div>
                `;
                
                const group = document.createElement('div');
                if (store.offers && store.offers.length > 0) {
                    store.offers.forEach(offer => {
                        const offDiv = document.createElement('div');
                        offDiv.className = 'offer';
                        offDiv.innerHTML = `<span class="offer-type">${offer.type}</span><span class="offer-reward">${offer.reward}</span>`;
                        group.appendChild(offDiv);
                    });
                } else {
                    group.innerHTML = '<div style="color: #999; font-size: 13px; text-align:center; padding: 10px;">Sem benefﾃｭcios cadastrados.</div>';
                }
                
                card.appendChild(group);
                storeList.appendChild(card);
            });
        }

        // Event Listeners
        searchInput.addEventListener('input', renderStores);
        sortSelect.addEventListener('change', renderStores);
        subcatSelect.addEventListener('change', renderStores);
